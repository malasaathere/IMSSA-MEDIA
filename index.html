<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>post-evaluvate-system</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Wipes out corrupted sessions safely (catches SecurityError if cookies are blocked)
      try {
        const APP_VERSION = "1.0.1";
        if (window.localStorage && window.localStorage.getItem("app_version") !== APP_VERSION) {
          window.localStorage.clear();
          window.sessionStorage.clear();
          window.localStorage.setItem("app_version", APP_VERSION);
        }
      } catch (e) {
        console.warn("Local storage is disabled by the browser.", e);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
